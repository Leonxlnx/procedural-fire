<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campfire</title>
<meta name="description" content="A fully procedural, physically based campfire: 3D combustion simulation, volumetric rendering and synthesized sound. No assets.">
<style>
  :root {
    color-scheme: dark;
    --ink: #e9d9c4;
    --dim: #8c7764;
    --line: rgba(233, 217, 196, 0.14);
    --glass: rgba(14, 9, 6, 0.58);
    --ember: #ff8a3d;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }

  #start {
    position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
    background: radial-gradient(ellipse at 50% 70%, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.55) 70%);
    transition: opacity 1.2s ease;
  }
  #start.gone { opacity: 0; pointer-events: none; }
  #start .card { text-align: center; padding: 0 16px; }
  #start h1 { font-weight: 500; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; margin: 0 0 14px; color: var(--ink); }
  #start p { margin: 0 0 22px; color: var(--dim); max-width: 34ch; }
  #start .go {
    display: inline-block; padding: 10px 22px; border: 1px solid rgba(255, 138, 61, 0.55); border-radius: 999px;
    color: #ffd2ad; letter-spacing: 0.08em; background: rgba(255, 120, 40, 0.08);
    box-shadow: 0 0 40px rgba(255, 120, 40, 0.18);
  }
  #start:hover .go { background: rgba(255, 120, 40, 0.16); }

  #panel {
    position: fixed; top: 14px; right: 14px; width: 210px; padding: 12px 12px 10px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px);
    transition: opacity 0.3s;
  }
  #panel.hidden, #hud.hidden { opacity: 0; pointer-events: none; }
  #panel .row { display: flex; gap: 6px; margin-bottom: 8px; }
  #panel button, #panel a {
    flex: 1; padding: 6px 0; font: inherit; font-size: 12px; color: var(--ink); text-align: center; text-decoration: none;
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  #panel button:hover, #panel a:hover { border-color: rgba(255, 138, 61, 0.5); }
  #panel a.cur { border-color: rgba(255, 138, 61, 0.7); color: #ffd2ad; }
  #panel label { display: block; font-size: 11px; color: var(--dim); margin: 4px 0 2px; letter-spacing: 0.04em; }
  #panel input[type=range] { width: 100%; accent-color: var(--ember); }
  #panel .keys { margin-top: 6px; font-size: 11px; color: var(--dim); }
  #hud { position: fixed; left: 14px; bottom: 12px; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #6f5f50; pointer-events: none; transition: opacity 0.3s; }
  @media (max-width: 520px) { #panel { width: auto; left: 14px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start" role="button" aria-label="Light the fire">
  <div class="card">
    <h1>Campfire</h1>
    <p>Simulated combustion, light and sound. Nothing here is a texture or a recording.</p>
    <span class="go">Click to light it &middot; sound on</span>
  </div>
</div>

<div id="panel">
  <div class="row">
    <button data-act="stoke" title="S">Stoke</button>
    <button data-act="pop" title="P">Pop</button>
    <button data-act="gust" title="G">Gust</button>
  </div>
  <label for="size">Fire size</label>
  <input id="size" type="range" min="0.3" max="1.4" step="0.01" value="1">
  <label for="vol">Volume</label>
  <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
  <div class="row" style="margin-top:8px">
    <a href="?q=low" data-q="low">Low</a><a href="?q=med" data-q="med">Med</a><a href="?q=high" data-q="high">High</a>
  </div>
  <div class="row"><button id="mute">Sound on</button></div>
  <div class="keys">drag orbit &middot; wheel zoom &middot; H hide &middot; F fullscreen</div>
</div>
<div id="hud"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
