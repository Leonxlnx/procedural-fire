<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Audio Test</title>
<style>
  :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #ff8a3d; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  label { display: block; margin: 14px 0 4px; color: var(--muted); }
  input[type=range] { width: 100%; }
  button { margin: 6px 6px 0 0; padding: 8px 14px; background: #222; color: var(--fg); border: 1px solid #444; border-radius: 6px; cursor: pointer; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  #log { margin-top: 16px; color: var(--muted); font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; max-height: 200px; overflow: auto; }
  #flash { height: 6px; background: var(--accent); opacity: 0; transition: opacity .25s; margin-top: 12px; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <h1>Procedural fire audio</h1>
  <p>Serve this folder over http (for example <code>npx http-server</code>) and open it in Chrome or Edge. AudioWorklets do not load from file:// URLs.</p>
  <button class="primary" id="start">Start</button>
  <label>Intensity <span id="iv">0.8</span></label><input id="intensity" type="range" min="0" max="1.5" step="0.01" value="0.8">
  <label>Wind <span id="wv">0</span></label><input id="wind" type="range" min="0" max="1.2" step="0.01" value="0">
  <label>Distance (m) <span id="dv">2</span></label><input id="distance" type="range" min="0.6" max="12" step="0.1" value="2">
  <div>
    <button data-ev="pop">Big pop</button><button data-ev="logShift">Log shift</button><button data-ev="gust">Gust</button><button data-ev="ember">Ember</button>
  </div>
  <div id="flash"></div>
  <div id="log"></div>
</main>
<script type="module">
import { makeOutdoorIR } from './fire-audio-dsp.mjs';
let ctx, node;
const $ = (id) => document.getElementById(id);
$('start').onclick = async () => {
  if (ctx) { ctx.state === 'running' ? ctx.suspend() : ctx.resume(); return; }
  ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
  await ctx.audioWorklet.addModule('./fire-worklet.js');
  node = new AudioWorkletNode(ctx, 'fire-audio', { numberOfInputs: 0, numberOfOutputs: 2, outputChannelCount: [2, 2], processorOptions: { seed: 1337 } });
  // procedural outdoor reverb on the send bus
  const [irL, irR] = makeOutdoorIR(ctx.sampleRate, 1337, { length: 1.6, t60: [0.55, 0.85, 0.6], tailDb: -24 });
  const ir = ctx.createBuffer(2, irL.length, ctx.sampleRate); ir.copyToChannel(irL, 0); ir.copyToChannel(irR, 1);
  const conv = new ConvolverNode(ctx, { buffer: ir, disableNormalization: true });
  // live master: make-up gain + fast compressor used as a peak catcher (offline path uses the real TP limiter)
  const makeup = new GainNode(ctx, { gain: Math.pow(10, 5 / 20) });
  const lim = new DynamicsCompressorNode(ctx, { threshold: -6, knee: 3, ratio: 20, attack: 0.001, release: 0.12 });
  node.connect(makeup, 0); node.connect(conv, 1); conv.connect(makeup); makeup.connect(lim).connect(ctx.destination);
  // audio -> visual sync: show each hero event when its sound reaches the speakers
  node.port.onmessage = (e) => {
    if (e.data.type !== 'events') return;
    for (const ev of e.data.events) {
      const ts = ctx.getOutputTimestamp();
      const delayMs = (ev.contextTime - ts.contextTime) * 1000 + (ts.performanceTime - performance.now());
      setTimeout(() => { $('flash').style.opacity = 1; setTimeout(() => ($('flash').style.opacity = 0), 120); }, Math.max(0, delayMs));
      $('log').textContent = `${ev.type} t=${ev.t.toFixed(3)} size=${ev.size ?? ev.strength ?? ''}\n` + $('log').textContent;
    }
  };
  for (const k of ['intensity', 'wind', 'distance']) {
    $(k).oninput = () => { const v = +$(k).value; node.parameters.get(k).setValueAtTime(v, ctx.currentTime); $(k[0] + 'v').textContent = v; };
  }
  document.querySelectorAll('[data-ev]').forEach((b) => (b.onclick = () => {
    const type = b.dataset.ev;
    const event = type === 'pop' ? { type, size: 1.1, pan: (Math.random() - 0.5) * 0.6 } : type === 'gust' ? { type, strength: 0.9, dur: 2 } : type === 'logShift' ? { type, size: 0.9 } : { type, level: 1, pan: 0 };
    // schedule slightly ahead so the event is sample-accurate
    node.port.postMessage({ type: 'event', event: { ...event, t: ctx.currentTime + 0.03 } });
  }));
};
</script>
</body>
</html>
